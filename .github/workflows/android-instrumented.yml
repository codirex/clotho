name: android-instrumented

# The instrumented tests of :clotho-android on a real emulator (real main looper, manifest merge and
# androidx lifecycle). Slow, so it is not part of the normal CI run: manual, weekly, and whenever this
# file changes so that a change here is exercised in its own pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC
  pull_request:
    paths:
      - .github/workflows/android-instrumented.yml

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 24 is the minSdk of the library; 34 is a current release.
        api-level: [24, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :clotho-android:connectedDebugAndroidTest --stacktrace
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: |
            clotho-android/build/reports/androidTests
            clotho-android/build/outputs/androidTest-results
          if-no-files-found: warn
