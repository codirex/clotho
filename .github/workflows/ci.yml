name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pure JVM modules: format, Android API 24 check, strict javadoc, all tests, coverage report.
  jvm:
    name: JVM modules (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew :clotho:build :clotho-test:build --stacktrace
      - name: Validate JApiCmp integration against the published core baseline
        run: ./gradlew :clotho:validateBinaryCompatibilityTool --stacktrace
      - name: Verify JApiCmp detects a deliberate binary break
        run: ./gradlew :clotho:verifyBinaryCompatibilityToolDetectsBreakingChange --stacktrace
      - name: Upload binary compatibility validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binary-compatibility-validation-jdk${{ matrix.java }}
          path: clotho/build/reports/binary-compatibility/validation
          if-no-files-found: warn
      - name: Coverage report
        if: matrix.java == 17
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            clotho/build/reports/jacoco
            clotho-test/build/reports/jacoco
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests
            **/build/test-results

  # Compile JMH benchmarks on every PR without running the long performance suite.
  bench-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Compile JMH benchmarks
        run: ./gradlew -PwithBench :clotho-bench:classes --stacktrace

  # Compile JCStress actors on every PR without running the long memory-model campaign.
  jcstress-compile:
    name: JCStress compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Compile JCStress tests
        run: ./gradlew -PwithJcstress :clotho-jcstress:classes --stacktrace

  # Android module: Robolectric tests, lint, and the sample app. Needs the Android SDK.
  android:
    name: Android module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, lint, assemble
        run: ./gradlew :clotho-android:testDebugUnitTest :clotho-android:lintDebug :clotho-android:spotlessCheck :app:assembleDebug --stacktrace
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports
            **/build/test-results

  # Publishing must stay possible: build every artifact exactly as the release would, unsigned.
  publish-dry-run:
    name: Publishing dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: List what would be released
        run: find ~/.m2/repository/org/codirex/clotho -name '*.pom' -o -name '*.jar' -o -name '*.aar' | sort
      - name: Verify published POM developer metadata
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          for artifact in clotho clotho-test clotho-android clotho-bom; do
            pom="$HOME/.m2/repository/org/codirex/clotho/$artifact/$version/$artifact-$version.pom"
            test -f "$pom"
            count="$(grep -c '<developer>' "$pom" || true)"
            if [ "$count" -ne 1 ]; then
              echo "$artifact POM contains $count developer entries; expected exactly one."
              exit 1
            fi
          done
          python - "$HOME/.m2/repository/org/codirex/clotho/clotho-bom/$version/clotho-bom-$version.pom" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(sys.argv[1]).getroot()
          android = root.find(
              "./m:dependencyManagement/m:dependencies/m:dependency[m:artifactId='clotho-android']",
              ns,
          )
          if android is None or android.findtext("m:type", namespaces=ns) != "aar":
              raise SystemExit("BOM must publish clotho-android with Maven type aar")
          PY
