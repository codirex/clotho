name: Release

# Publishes to Maven Central (Central Portal) when a version tag is pushed:
#   1. set VERSION_NAME in gradle.properties AND Clotho.VERSION to the release (no -SNAPSHOT)
#   2. commit, then:  git tag v0.1.0 && git push origin v0.1.0
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD          Central Portal user token
#   SIGNING_KEY_ID, SIGNING_PASSWORD                         same values as signing.keyId / signing.password
#   SIGNING_SECRET_KEY_RING_FILE_BASE64                      base64 of the file signing.secretKeyRingFile points to
# Optional repository variable:
#   MAVEN_CENTRAL_AUTO_RELEASE = true   release automatically after validation (default: upload only,
#                                       then press "Publish" in the Central Portal)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in the build
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          code="$(sed -n 's/.*String VERSION = "\(.*\)";/\1/p' clotho/src/main/java/org/codirex/clotho/Clotho.java)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag VERSION_NAME=$version Clotho.VERSION=$code"
          [ "$tag" = "$version" ] || { echo "::error::tag $tag != VERSION_NAME $version"; exit 1; }
          [ "$code" = "$version" ] || { echo "::error::Clotho.VERSION $code != VERSION_NAME $version"; exit 1; }
          case "$version" in *-SNAPSHOT) echo "::error::refusing to release a SNAPSHOT"; exit 1;; esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Build and test everything that is published
        run: ./gradlew :clotho:build :clotho-test:build :clotho-android:build --stacktrace

      - name: Restore the signing key ring
        env:
          KEYRING_B64: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE_BASE64 }}
        run: |
          [ -n "$KEYRING_B64" ] || { echo "::error::secret SIGNING_SECRET_KEY_RING_FILE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYRING_B64" | base64 -d > "$RUNNER_TEMP/secring.gpg"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          AUTO_RELEASE: ${{ vars.MAVEN_CENTRAL_AUTO_RELEASE || 'false' }}
        run: |
          ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace \
            -PmavenCentralAutomaticPublishing="$AUTO_RELEASE" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile="$RUNNER_TEMP/secring.gpg"

      - name: Clean up the key ring
        if: always()
        run: rm -f "$RUNNER_TEMP/secring.gpg"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $flags
