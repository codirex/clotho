# Published coordinates
GROUP=org.codirex.clotho
VERSION_NAME=0.1.0-alpha01

# POM metadata shared by every published module (read by build-logic/clotho.publish).
# Per-module POM_NAME / POM_DESCRIPTION are in each module's own gradle.properties.
POM_URL=https://github.com/codirex/clotho
POM_SCM_CONNECTION=scm:git:git://github.com/codirex/clotho.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/codirex/clotho.git
POM_DEVELOPER_ID=codirex
POM_DEVELOPER_NAME=Codirex
POM_DEVELOPER_URL=https://github.com/codirex

# Maven Central: false = upload and validate, then release by hand in the Central Portal;
# true = release automatically once validation passes (the release workflow sets this).
mavenCentralAutomaticPublishing=false

# Build
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
